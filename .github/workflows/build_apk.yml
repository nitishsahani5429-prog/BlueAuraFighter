name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot Headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot_bin

      - name: Export APK Direct
        run: |
          mkdir -p build
          ./godot_bin --headless --export-release "Android" build/BlueAuraFighter.apk || ./godot_bin --headless --export-debug "Android" build/BlueAuraFighter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueAuraFighter-APK
          path: build/BlueAuraFighter.apk
